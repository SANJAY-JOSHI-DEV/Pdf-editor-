<style>
:root{
  --bg:#0f1115; --bg2:#14161b; --panel:#181b22; --panel2:#20242d; --line:#2b303b;
  --text:#e7e9ee; --muted:#98a1b0; --accent:#5b8cff; --accent2:#3e6fe6; --danger:#ff5d5d;
  --warn:#f5a524; --ok:#3ecf8e; --shadow:0 2px 14px rgba(0,0,0,.45); --radius:10px;
  --tb-h:52px;
}
[data-theme=light]{
  --bg:#e9ecf1; --bg2:#f7f8fa; --panel:#ffffff; --panel2:#f0f2f6; --line:#d6dae2;
  --text:#1b1f27; --muted:#5d6675; --shadow:0 2px 12px rgba(20,30,50,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;}
body{height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
  -webkit-tap-highlight-color:transparent;}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ---------- App bar ---------- */
#appbar{order:1;height:50px;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
#appbar .brand{font-weight:700;letter-spacing:.2px;margin-right:6px;white-space:nowrap}
#appbar .fname{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn:disabled{opacity:.4;cursor:default;background:transparent}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.outline{border-color:var(--line)}
.btn.danger{color:var(--danger)}
.btn.active{background:var(--accent);color:#fff}
.btn.sm{height:30px;min-width:30px;padding:0 8px;font-size:13px}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.pagenav{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:13px}
.pagenav input{width:46px;height:30px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--panel);}
.zoomlbl{min-width:48px;text-align:center;font-size:13px;color:var(--muted)}

/* ---------- Tool bar (top on desktop, bottom on phones) ---------- */
#toolbar{order:2;display:flex;align-items:center;gap:2px;padding:4px 8px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
#toolbar::-webkit-scrollbar{display:none}
.tool{flex-direction:column;height:46px;min-width:52px;gap:2px;padding:2px 6px;font-size:10.5px;color:var(--muted)}
.tool.active{background:var(--accent);color:#fff}
#optbar{order:3;display:flex;align-items:center;flex-wrap:nowrap;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;min-height:44px;flex:none;scrollbar-width:thin}
#optbar label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;white-space:nowrap}
#optbar input[type=range]{width:90px}
#optbar .hint{color:var(--muted);font-size:12.5px;white-space:nowrap}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
select,input[type=text],input[type=number],input[type=password],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-height:32px}
textarea{resize:vertical}

/* ---------- Main area ---------- */
#main{order:4;flex:1;display:flex;min-height:0;position:relative}
#sidebar{width:178px;flex:none;display:flex;flex-direction:column;background:var(--bg2);border-right:1px solid var(--line);min-height:0}
#sidebar .sbhead{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
#sidebar .sbinfo{width:100%;font-size:12px;color:var(--muted);padding:0 2px 4px}
#thumbs{flex:1;overflow-y:auto;padding:8px 10px 40px;display:flex;flex-direction:column;gap:12px;touch-action:pan-y}
.thumb{position:relative;border-radius:6px;padding:4px;border:2px solid transparent;cursor:pointer;user-select:none}
.thumb.current{border-color:var(--accent)}
.thumb.checked{background:rgba(91,140,255,.18)}
.thumb.dragging{opacity:.4}
.thumb.drop-before{box-shadow:0 -3px 0 var(--warn)}
.thumb.drop-after{box-shadow:0 3px 0 var(--warn)}
.thumb .tc{display:block;margin:0 auto;background:#fff;box-shadow:var(--shadow);max-width:100%}
.thumb .tn{text-align:center;font-size:12px;color:var(--muted);margin-top:3px}
.thumb .chk{position:absolute;top:6px;left:6px;width:22px;height:22px;accent-color:var(--accent)}
.thumb .handle{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:6px;background:var(--panel2);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;color:var(--muted)}
#viewer{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y;background:var(--bg);overscroll-behavior:contain}
#pages{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px;width:max-content;min-width:100%;transform-origin:0 0}
.page{position:relative;background:#fff;box-shadow:var(--shadow);flex:none}
.page canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.page.noscroll{touch-action:none}
.page .pnum{position:absolute;left:-2px;top:-17px;font-size:11px;color:var(--muted)}
.page.tool-draw{cursor:crosshair}
.page .sel-rect{position:absolute;border:2px dashed var(--accent);background:rgba(91,140,255,.12);pointer-events:none}
.page .sel-rect.cover{border-color:var(--warn);background:rgba(245,165,36,.15)}
.page .sel-rect.wm{border-color:var(--danger);background:rgba(255,93,93,.12)}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
#empty .card{max-width:440px;text-align:center;border:2px dashed var(--line);border-radius:16px;padding:32px 22px;background:var(--panel)}
#empty h1{font-size:20px;margin:6px 0 4px}
#empty p{color:var(--muted);margin:6px 0 16px}
body.dragover #empty .card,body.dragover #viewer{outline:3px dashed var(--accent);outline-offset:-8px}

/* ---------- Right panel / bottom sheet ---------- */
#panel{width:340px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:none;flex-direction:column;min-height:0}
#panel.open{display:flex}
#panel .phead{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
#panel .phead h2{flex:1;margin:0;font-size:15px}
#panel .pbody{overflow-y:auto;padding:12px;flex:1}
.psec{margin-bottom:16px}
.psec h3{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.row>label{display:inline-flex;align-items:center;gap:6px}
label.row{flex-wrap:nowrap;align-items:flex-start;cursor:pointer}
label.row input[type=checkbox]{margin-top:3px;flex:none}
.col{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.col>input,.col>select,.col>textarea{width:100%}
.note{font-size:12.5px;color:var(--muted);background:var(--panel2);border-radius:8px;padding:8px 10px;margin:8px 0}
.note.warn{color:#1c1300;background:var(--warn)}
.note.err{color:#fff;background:#b43a3a}
.tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--panel2);padding:4px;border-radius:9px}
.tabs .btn{flex:1;height:32px;font-size:13px}
.formfield{border-bottom:1px solid var(--line);padding:8px 0}
.formfield .fname{font-size:12px;color:var(--muted);word-break:break-all}

/* ---------- Toasts, modals, busy ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:1000;width:min(92vw,460px);pointer-events:none}
.toast{background:#2a2f3a;color:#fff;border-left:4px solid var(--accent);padding:10px 12px;border-radius:8px;box-shadow:var(--shadow);font-size:13.5px;pointer-events:none;animation:tin .18s ease-out}
.toast.error{border-color:var(--danger)} .toast.warn{border-color:var(--warn)} .toast.ok{border-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:900;padding:12px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(100%,520px);max-height:92dvh;display:flex;flex-direction:column}
.modal .mh{padding:12px 16px;font-weight:650;font-size:16px;border-bottom:1px solid var(--line)}
.modal .mb{padding:14px 16px;overflow-y:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:950;display:flex;align-items:center;justify-content:center}
#busy .box{background:var(--panel);padding:18px 22px;border-radius:12px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:90vw}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#sigpad{width:100%;height:220px;background:#fff;border-radius:8px;touch-action:none;display:block}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:30;max-width:92%;}

/* ---------- Phone layout: tools at the bottom, sidebar + panel become drawers ---------- */
@media (max-width:760px){
  #appbar .lbl,.hide-sm{display:none}
  #appbar{padding:0 4px;gap:2px}
  #main{order:2}
  #optbar{order:3;border-top:1px solid var(--line);border-bottom:none}
  #toolbar{order:4;border-top:1px solid var(--line);border-bottom:none;padding-bottom:calc(4px + env(safe-area-inset-bottom))}
  #sidebar{position:absolute;left:0;top:0;bottom:0;z-index:40;width:160px;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  #sidebar.open{transform:none}
  #panel{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:78%;z-index:45;border-left:none;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.4)}
  #pages{padding:12px 8px;gap:14px}
  .tool{min-width:50px}
  #toasts{bottom:calc(120px + env(safe-area-inset-bottom))}
}
@media (min-width:761px){ #sbToggle{display:none} body.sb-closed #sidebar{display:none} }
</style>
</head>

<header id="appbar">
  <button class="btn" id="sbToggle" title="Pages"><svg class="i"><use href="#i-pages"/></svg></button>
  <span class="brand">PDF Desk</span>
  <button class="btn" id="btnOpen" title="Open PDF (Ctrl+O)"><svg class="i"><use href="#i-open"/></svg><span class="lbl">Open</span></button>
  <button class="btn primary" id="btnSave" title="Download edited PDF (Ctrl+S)" disabled><svg class="i"><use href="#i-save"/></svg><span class="lbl">Download</span></button>
  <span class="fname" id="fname"></span>
  <button class="btn" id="btnUndo" title="Undo (Ctrl+Z)" disabled><svg class="i"><use href="#i-undo"/></svg></button>
  <button class="btn" id="btnRedo" title="Redo (Ctrl+Y)" disabled><svg class="i"><use href="#i-redo"/></svg></button>
  <span class="sep hide-sm"></span>
  <button class="btn hide-sm" id="btnZoomOut" title="Zoom out"><svg class="i"><use href="#i-minus"/></svg></button>
  <span class="zoomlbl hide-sm" id="zoomLbl">100%</span>
  <button class="btn hide-sm" id="btnZoomIn" title="Zoom in"><svg class="i"><use href="#i-plus"/></svg></button>
  <button class="btn" id="btnFit" title="Fit width"><svg class="i"><use href="#i-fit"/></svg></button>
  <span class="sep hide-sm"></span>
  <span class="pagenav"><input id="pageInput" type="text" inputmode="numeric" value="0" aria-label="Go to page"><span>/</span><span id="pageCount">0</span></span>
  <button class="btn" id="btnMenu" title="More"><svg class="i"><use href="#i-menu"/></svg></button>
</header>

  <button class="btn tool active" data-tool="select"><svg class="i"><use href="#i-select"/></svg>Select</button>
  <button class="btn tool" data-tool="text"><svg class="i"><use href="#i-text"/></svg>Text</button>
  <button class="btn tool" data-tool="pen"><svg class="i"><use href="#i-pen"/></svg>Pen</button>
  <button class="btn tool" data-tool="highlight"><svg class="i"><use href="#i-hl"/></svg>Highlight</button>
  <button class="btn tool" data-tool="rect"><svg class="i"><use href="#i-rect"/></svg>Rect</button>

  <button class="btn tool" data-tool="whiteout"><svg class="i"><use href="#i-white"/></svg>Whiteout</button>

<script>
'use strict';
/* =====================================================================
   PDF Desk — single-file, client-side PDF editor.
   Sections: Utilities · State · History (commands) · Storage · PDF loading ·
   Rendering · Objects · Tools · Watermark · Page ops · Export · Forms · UI
   ===================================================================== */

/* ============================ Utilities ============================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LIBS_OK = typeof PDFLib !== 'undefined' && typeof pdfjsLib !== 'undefined';
const { PDFDocument, StandardFonts, rgb, degrees, PDFName, PDFDict, PDFArray, PDFRef, PDFNumber,
  PDFRawStream, PDFString, PDFHexString, LineCapStyle, BlendMode } = LIBS_OK ? PDFLib : {};
const PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
if (LIBS_OK) pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;

function toast(msg, type = 'info', ms) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ms || (type === 'error' ? 7000 : 3800));
  el.onclick = () => el.remove();
  if (type === 'error') console.warn('[PDF Desk]', msg);
}
function fail(context, err) {
  console.error(context, err);
  const m = (err && (err.message || err.name)) || String(err);
  toast(`${context}: ${m}`, 'error');
}

let busyDepth = 0;
function busy(on, text) {
  busyDepth = Math.max(0, busyDepth + (on ? 1 : -1));
  $('#busy').classList.toggle('hidden', busyDepth === 0);
  if (text) $('#busyText').textContent = text;
}
function busyText(t) { $('#busyText').textContent = t; }
/** Lets the browser paint progress text during long loops. */
const yieldUI = () => new Promise(r => requestAnimationFrame(() => r()));

/**
 * Generic modal. body: HTML string or Node. buttons: [{label,value,primary,danger}].
 * Resolves with the clicked button's value (or null on backdrop/Escape).
 * onOpen(root) can wire inputs; collect(root) builds the result for buttons with collect:true.
 */
function modal({ title, body, buttons = [{ label: 'OK', value: true, primary: true }], onOpen, collect, dismissable = true }) {
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="mh"></div><div class="mb"></div><div class="mf"></div></div>`;
    $('.mh', back).textContent = title || '';
    const mb = $('.mb', back);
    if (typeof body === 'string') mb.innerHTML = body; else if (body) mb.appendChild(body);
    const done = (v) => { back.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    for (const b of buttons) {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (b.primary ? 'primary' : 'outline') + (b.danger ? ' danger' : '');
      btn.textContent = b.label;
      btn.onclick = () => {
        if (b.collect && collect) { const r = collect(back); if (r === undefined) return; done(r); }
        else done(b.value);
      };
      $('.mf', back).appendChild(btn);
    }
    const onKey = (e) => {
      if (e.key === 'Escape' && dismissable) { e.stopPropagation(); done(null); }
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
        const p = buttons.find(b => b.primary); if (p) { e.preventDefault(); $$('.mf .btn', back)[buttons.indexOf(p)].click(); }
      }
    };
    document.addEventListener('keydown', onKey, true);
    back.addEventListener('pointerdown', (e) => { if (e.target === back && dismissable) done(null); });
    document.body.appendChild(back);
    if (onOpen) onOpen(back);
    const f = $('input,textarea,select', mb); if (f && !matchMedia('(pointer:coarse)').matches) setTimeout(() => f.focus(), 30);
  });
}
async function confirmBox(title, text, okLabel = 'OK', danger = false) {
  return !!(await modal({ title, body: `<p>${esc(text)}</p>`, buttons: [{ label: 'Cancel', value: false }, { label: okLabel, value: true, primary: !danger, danger }] }));
}
async function askText(title, label, def = '', type = 'text') {
  return modal({
    title, body: `<div class="col"><label>${esc(label)}</label><input type="${type}" id="askInp" value="${esc(def)}"></div>`,
    buttons: [{ label: 'Cancel', value: null }, { label: 'OK', primary: true, collect: true }],
    collect: (r) => $('#askInp', r).value
  });
}

function hexToRgb01(hex) {
  const h = (hex || '#000000').replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16) || 0;
  return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
}
const pdfColor = (hex) => { const [r, g, b] = hexToRgb01(hex); return rgb(r, g, b); };
const rgbToHex = (r, g, b) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');

function downloadBlob(data, name, mime = 'application/pdf') {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
const baseName = () => (state.fileName || 'document.pdf').replace(/\.pdf$/i, '');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const fmtBytes = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB';

/** Parse "1-3, 5, 8-" (1-based, inclusive) into 0-based indices. Throws on invalid input. */
function parseRanges(text, count) {
  const groups = [];
  for (const part of String(text).split(/[,;]+/).map(s => s.trim()).filter(Boolean)) {
    const m = part.match(/^(\d*)\s*(?:-\s*(\d*))?$/);
    if (!m) throw new Error(`"${part}" is not a page range`);
    const a = m[1] ? +m[1] : 1;
    const b = part.includes('-') ? (m[2] ? +m[2] : count) : a;
    if (a < 1 || b > count || a > b) throw new Error(`"${part}" is outside 1–${count}`);
    const g = []; for (let i = a; i <= b; i++) g.push(i - 1);
    groups.push(g);
  }
  if (!groups.length) throw new Error('Enter at least one page or range');
  return groups;
}

/* ============================== State ============================== */
/*
 * Single source of truth:
 *  - state.pages: ordered list of page models. Each refers to an immutable "source"
 *    PDF (src + idx) and carries its own extra rotation and overlay objects.
 *  - state.sources / images / fonts: immutable registries (never edited in place).
 *    Watermark removal and form filling produce NEW source versions, so every
 *    edit is just a change to state.pages and can be undone by restoring a snapshot.
 * Object coordinates are in PDF points, in the page's *displayed* orientation
 * (origin top-left of the rotated page view).
 */
const DEFAULT_SETTINGS = { font: 'Helvetica', color: '#e53935', textColor: '#111111', width: 3, fontSize: 16, theme: 'dark' };
const state = {
  fileName: null, fileSize: 0, origSrc: null, readOnly: false,
  sources: new Map(),   // id -> {id,name,bytes,info:[{w,h,rot}], pdfjs, libDoc, pageCache, textCache}
  pages: [],            // [{id,src,idx,w,h,baseRot,rot,v,objects:[]}]
  images: new Map(),    // id -> {bytes,mime,el,w,h}
  fonts: new Map(),     // id -> {id,name,bytes,family}
  zoom: 1, tool: 'select', sel: null /* {pageId,objId} */, current: 0, checked: new Set(),
  settings: { ...DEFAULT_SETTINGS },
  opts: {},             // per-tool options, filled by initOpts()
  cover: { color: '#ffffff', auto: true, blur: false, all: false },
  wm: { tab: 'auto', text: '', scope: 'all', range: '', annots: true, tagged: true, regionAll: false },
  panel: null,
};
let REV = 1; // global counter used to version page overlays (never reused)

function initOpts() {
  const s = state.settings;
  const base = { color: s.color, width: s.width, opacity: 1, fill: false };
  state.opts = {
    pen: { ...base }, line: { ...base }, arrow: { ...base }, rect: { ...base }, ellipse: { ...base },
    highlight: { color: '#ffe600', width: 14, opacity: 0.4 },
    whiteout: { color: '#ffffff' },
    text: { font: s.font, size: s.fontSize, color: s.textColor, bold: false, italic: false, opacity: 1 },
  };
}
const pageById = (id) => state.pages.find(p => p.id === id);
const pageIndex = (id) => state.pages.findIndex(p => p.id === id);
/** Displayed rotation and size (points) of a page model. */
function pview(p) {
  const R = ((p.baseRot + p.rot) % 360 + 360) % 360;
  return R % 180 ? { R, w: p.h, h: p.w } : { R, w: p.w, h: p.h };
}
function findObj(pageId, objId) {
  const p = pageById(pageId); if (!p) return null;
  const o = p.objects.find(o => o.id === objId);
  return o ? { page: p, obj: o } : null;
}
const selected = () => state.sel ? findObj(state.sel.pageId, state.sel.objId) : null;

/* ======================= History (command objects) ======================= */
/*
 * Every edit is a Command holding before/after snapshots of state.pages.
 * Snapshots are cheap: pages hold only small JSON (bytes live in immutable registries).
 */
const MAX_HISTORY = 100;
class Command {
  constructor(label, before, after) { this.label = label; this.before = before; this.after = after; }
  undo() { state.pages = structuredClone(this.before); }
  redo() { state.pages = structuredClone(this.after); }
}
const history = { undo: [], redo: [] };
const snap = () => structuredClone(state.pages);

function pushCommand(label, before) {
  history.undo.push(new Command(label, before, snap()));
  if (history.undo.length > MAX_HISTORY) { history.undo.shift(); gcSources(); }
  history.redo = [];
  onDocChanged();
}
/** Run a synchronous mutation of state.pages as one undoable command. */
function commit(label, fn) {
  const before = snap();
  try { fn(); }
  catch (e) { state.pages = before; fail(label, e); onDocChanged(); return false; }
  pushCommand(label, before);
  return true;
}
function touch(p) { p.v = ++REV; }
function undo() {
  const c = history.undo.pop(); if (!c) return;
  c.undo(); history.redo.push(c); state.sel = null; onDocChanged(); toast('Undo: ' + c.label);
}
function redo() {
  const c = history.redo.pop(); if (!c) return;
  c.redo(); history.undo.push(c); state.sel = null; onDocChanged(); toast('Redo: ' + c.label);
}
function resetHistory() { history.undo = []; history.redo = []; }

/** Drop sources that nothing (current state or any history snapshot) refers to. */
function gcSources() {
  const used = new Set(state.pages.map(p => p.src));
  for (const c of [...history.undo, ...history.redo]) for (const arr of [c.before, c.after]) for (const p of arr) used.add(p.src);
  for (const [id, s] of state.sources) {
    if (!used.has(id)) { try { s.pdfjs && s.pdfjs.destroy(); } catch (e) { /* ignore */ } state.sources.delete(id); }
  }
}

/* ============================== Storage ============================== */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('pdfdesk.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pdfdesk.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem('pdfdesk.' + k); } catch (e) { /* ignore */ } },
};
function loadSettings() { state.settings = { ...DEFAULT_SETTINGS, ...LS.get('settings', {}) }; applyTheme(); initOpts(); }
function saveSettings() { LS.set('settings', state.settings); }
function applyTheme() { document.documentElement.dataset.theme = state.settings.theme; }

/* IndexedDB keeps uploaded fonts so the user doesn't re-upload them every visit. */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('pdfdesk', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('fonts', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbFonts(op, val) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('fonts', op === 'all' ? 'readonly' : 'readwrite');
    const st = tx.objectStore('fonts');
    const rq = op === 'all' ? st.getAll() : op === 'put' ? st.put(val) : st.delete(val);
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
  });
}

/*
 * Autosave: only metadata + overlay objects (not the PDF bytes). It can be restored
 * when the same file (name + size) is reopened. Image objects and structural edits
 * that depend on other files (merges, watermark versions) are not autosaved.
 */
const autosave = debounce(() => {
  if (!state.origSrc || !state.pages.length) return;
  const simple = state.pages.every(p => p.src === state.origSrc);
  const data = { name: state.fileName, size: state.fileSize, savedAt: Date.now(), simple };
  if (simple) {
    data.pages = state.pages.map(p => ({ idx: p.idx, rot: p.rot, objects: p.objects.filter(o => !o.imageId) }));
  }
  if (!LS.set('session', data)) { LS.del('session'); toast('Autosave skipped: session too large for local storage.', 'warn'); }
}, 1200);

async function clearAllLocalData() {
  if (!await confirmBox('Clear all local data', 'This removes settings, autosaved sessions, saved signature, uploaded fonts and the offline app cache from this browser. Your open document is not affected.', 'Clear', true)) return;
  try {
    Object.keys(localStorage).filter(k => k.startsWith('pdfdesk.')).forEach(k => localStorage.removeItem(k));
    await new Promise(r => { const q = indexedDB.deleteDatabase('pdfdesk'); q.onsuccess = q.onerror = q.onblocked = () => r(); });
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    toast('Local data cleared. Reloading…', 'ok');
    setTimeout(() => location.reload(), 900);
  } catch (e) { fail('Clear data', e); }
}

/* ============================ PDF loading ============================ */
async function askPassword(retry) {
  return modal({
    title: 'Password required',
    body: `<p>${retry ? '<b>Wrong password.</b> ' : ''}This PDF is password-protected.</p><div class="col"><input type="password" id="askInp" autocomplete="off" placeholder="Password"></div>`,
    buttons: [{ label: 'Cancel', value: null }, { label: 'Unlock', primary: true, collect: true }],
    collect: r => $('#askInp', r).value
  });
}

/** Open bytes with pdf.js (handles passwords). Returns {doc, password}. */
async function openPdfJs(bytes) {
  let password, cancelled = false;
  const task = pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported: false });
  task.onPassword = async (update, reason) => {
    const wasBusy = busyDepth > 0; if (wasBusy) busy(false);
    const pw = await askPassword(reason === pdfjsLib.PasswordResponses.INCORRECT_PASSWORD);
    if (wasBusy) busy(true);
    if (pw == null) { cancelled = true; task.destroy(); return; }
    password = pw; update(pw);
  };
  try { return { doc: await task.promise, password }; }
  catch (e) {
    if (cancelled) { const er = new Error('Password entry cancelled'); er.name = 'PasswordException'; throw er; }
    throw e;
  }
}

/** Register an immutable source PDF. info can be passed when page sizes are already known. */
async function addSource(bytes, name, { pdfjs = null, info = null } = {}) {
  const id = 's' + uid();
  const src = { id, name, bytes, info, pdfjs, libDoc: null, pageCache: new Map(), textCache: new Map() };
  if (!info) {
    const doc = pdfjs || (await openPdfJs(bytes)).doc;
    src.pdfjs = doc;
    src.info = await readPageInfo(doc);
  }
  state.sources.set(id, src);
  return src;
}
async function readPageInfo(doc) {
  const n = doc.numPages, info = new Array(n);
  const big = n > 300;
  for (let i = 0; i < n; i += 24) {
    const batch = [];
    for (let j = i; j < Math.min(n, i + 24); j++) batch.push(doc.getPage(j + 1).then(pg => {
      const vp = pg.getViewport({ scale: 1, rotation: 0 });
      info[j] = { w: vp.width, h: vp.height, rot: pg.rotate || 0 };
    }));
    await Promise.all(batch);
    if (big) busyText(`Reading pages… ${Math.min(n, i + 24)}/${n}`);
  }
  return info;
}
async function getPdfJs(src) {
  if (!src.pdfjs) src.pdfjs = (await openPdfJs(src.bytes)).doc;
  return src.pdfjs;
}
async function getPdfPage(srcId, idx) {
  const src = state.sources.get(srcId);
  if (!src) throw new Error('Missing source');
  if (!src.pageCache.has(idx)) src.pageCache.set(idx, getPdfJs(src).then(d => d.getPage(idx + 1)));
  return src.pageCache.get(idx);
}
/** Read-only pdf-lib copy of a source (for copyPages / form inspection). */
async function getLibDoc(src) {
  if (!src.libDoc) src.libDoc = await PDFDocument.load(src.bytes, { updateMetadata: false });
  return src.libDoc;
}
function pageModelsFor(src, indices) {
  return indices.map(i => ({ id: 'p' + uid(), src: src.id, idx: i, w: src.info[i].w, h: src.info[i].h, baseRot: src.info[i].rot, rot: 0, v: ++REV, objects: [] }));
}

/**
 * Checks whether pdf-lib can edit the bytes. Encrypted files cannot be edited by pdf-lib,
 * so we offer an image-based copy made from pdf.js renders instead.
 */
async function checkEditable(bytes) {
  try { await PDFDocument.load(bytes, { updateMetadata: false }); return { ok: true }; }
  catch (e) {
    const enc = /encrypt/i.test(e.message || '');
    return { ok: false, encrypted: enc, error: e };
  }
}

async function rasterizeToPdf(pdfjsDoc, name) {
  const out = await PDFDocument.create();
  for (let i = 1; i <= pdfjsDoc.numPages; i++) {
    busyText(`Converting page ${i}/${pdfjsDoc.numPages}…`); await yieldUI();
    const pg = await pdfjsDoc.getPage(i);
    const vp1 = pg.getViewport({ scale: 1 });
    const scale = Math.min(2, 2400 / Math.max(vp1.width, vp1.height));
    const vp = pg.getViewport({ scale });
    const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await pg.render({ canvasContext: ctx, viewport: vp }).promise;
    const jpg = await new Promise(r => c.toBlob(b => r(b), 'image/jpeg', 0.9));
    const img = await out.embedJpg(new Uint8Array(await jpg.arrayBuffer()));
    const page = out.addPage([vp1.width, vp1.height]);
    page.drawImage(img, { x: 0, y: 0, width: vp1.width, height: vp1.height });
    c.width = c.height = 0;
  }
  return out.save();
}

/** Load a PDF file for editing (main document) or for merging. Returns a source or null. */
async function loadPdfFile(file, { forMerge = false } = {}) {
  if (!LIBS_OK) { toast('PDF libraries failed to load. Check your connection and reload once (they are cached for offline use afterwards).', 'error'); return null; }
  if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) { toast(`"${file.name}" is not a PDF.`, 'error'); return null; }
  busy(true, `Opening ${file.name}…`);
  try {
    let bytes = new Uint8Array(await file.arrayBuffer());
    const head = new TextDecoder('latin1').decode(bytes.subarray(0, 1024));
    if (!head.includes('%PDF')) throw new Error('This file does not look like a PDF (missing %PDF header). It may be corrupted.');
    let opened;
    try { opened = await openPdfJs(bytes); }
    catch (e) {
      if (e && e.name === 'PasswordException') { toast('Opening cancelled: the PDF needs a password.', 'warn'); return null; }
      throw new Error('Could not read this PDF — it may be corrupted or use an unsupported format. (' + (e.message || e) + ')');
    }
    const check = await checkEditable(bytes);
    if (!check.ok) {
      busy(false);
      const why = check.encrypted
        ? 'This PDF is encrypted. The browser can display it, but the editing library cannot rewrite encrypted files.'
        : 'This PDF opened for viewing, but its internal structure is damaged so it cannot be rewritten directly.';
      const choice = await modal({
        title: 'Limited PDF', dismissable: false,
        body: `<p>${why}</p><p>You can convert it to an <b>image-based copy</b> (every page becomes a picture). All drawing, text, cover and page tools work on the copy, but its text will no longer be selectable and text-based watermark removal will not work.</p>`,
        buttons: forMerge ? [{ label: 'Cancel', value: 'cancel' }, { label: 'Convert & merge', value: 'convert', primary: true }]
          : [{ label: 'Cancel', value: 'cancel' }, { label: 'View only', value: 'view' }, { label: 'Convert to image copy', value: 'convert', primary: true }]
      });
      busy(true, 'Working…');
      if (choice === 'cancel' || choice == null) { opened.doc.destroy(); return null; }
      if (choice === 'convert') {
        bytes = await rasterizeToPdf(opened.doc, file.name);
        opened.doc.destroy();
        opened = await openPdfJs(bytes);
      } else {
        state.readOnly = true;
      }
    } else if (!forMerge) state.readOnly = false;
    const src = await addSource(bytes, file.name, { pdfjs: opened.doc, info: await readPageInfo(opened.doc) });
    if (!forMerge && (file.size > 100 * 1048576 || src.info.length > 300)) {
      toast(`Large document (${fmtBytes(file.size)}, ${src.info.length} pages). Pages and thumbnails render on demand; heavy operations may be slow.`, 'warn', 9000);
    }
    return src;
  } catch (e) {
    fail('Open failed', e);
    return null;
  } finally { busy(false); }
}

async function openMainFile(file) {
  if (history.undo.length && !await confirmBox('Open another PDF?', 'Unsaved edits to the current document will be lost.', 'Open')) return;
  const prevSources = [...state.sources.values()];
  const src = await loadPdfFile(file);
  if (!src) return;
  for (const s of prevSources) { try { s.pdfjs && s.pdfjs.destroy(); } catch (e) { /* ignore */ } state.sources.delete(s.id); }
  state.fileName = file.name; state.fileSize = file.size; state.origSrc = src.id;
  state.pages = pageModelsFor(src, src.info.map((_, i) => i));
  state.sel = null; state.checked.clear(); state.current = 0;
  resetHistory();
  $('#pages').innerHTML = ''; $('#thumbs').innerHTML = '';
  pageEls.clear(); thumbEls.clear();
  fitWidth(true);
  onDocChanged();
  toast(`Opened ${file.name} — ${state.pages.length} page${state.pages.length > 1 ? 's' : ''}${state.readOnly ? ' (view only)' : ''}`, 'ok');
  await offerRestore(src);
  detectScanned(src);
}

async function offerRestore(src) {
  const s = LS.get('session');
  if (!s || s.name !== state.fileName || s.size !== state.fileSize) return;
  if (!s.simple || !s.pages) { toast('A previous session for this file included merges or watermark edits, which are not autosaved.', 'warn'); return; }
  const objCount = s.pages.reduce((n, p) => n + p.objects.length, 0);
  const changed = objCount || s.pages.length !== src.info.length || s.pages.some((p, i) => p.idx !== i || p.rot);
  if (!changed) return;
  const ok = await confirmBox('Restore previous session?', `Found autosaved edits for this file from ${new Date(s.savedAt).toLocaleString()} (${objCount} annotation${objCount === 1 ? '' : 's'}, ${s.pages.length} pages). Restore them?`, 'Restore');
  if (!ok) return;
  commit('Restore session', () => {
    state.pages = s.pages.filter(p => p.idx < src.info.length).map(p => ({ ...pageModelsFor(src, [p.idx])[0], rot: p.rot || 0, objects: p.objects }));
  });
}

/** Heuristic: pages with no text but with content are probably scans. */
async function detectScanned(src) {
  try {
    const doc = await getPdfJs(src);
    const n = Math.min(3, doc.numPages); let empty = 0;
    for (let i = 1; i <= n; i++) { const tc = await (await doc.getPage(i)).getTextContent(); if (!tc.items.some(it => it.str && it.str.trim())) empty++; }
    if (empty === n) toast('This looks like a scanned/image-only PDF. Text-based watermark removal and Replace text will not work; use Cover mode or Whiteout instead.', 'warn', 10000);
  } catch (e) { /* non-critical */ }
}

/* ============================== Rendering ============================== */
const pageEls = new Map();   // pageId -> {el, base, ovl, key, task, pxPerPt}
const thumbEls = new Map();  // pageId -> {el, canvas, key}
const visible = new Set();
const COARSE = matchMedia('(pointer:coarse)').matches;
const DPR = () => Math.min(window.devicePixelRatio || 1, 3);

const pageIO = new IntersectionObserver((entries) => {
  for (const en of entries) {
    const id = en.target.dataset.id;
    if (en.isIntersecting) { visible.add(id); const p = pageById(id); if (p) renderPage(p); }
    else { visible.delete(id); freePage(id); }
  }
}, { root: $('#viewer'), rootMargin: '900px 0px' });

const thumbIO = new IntersectionObserver((entries) => {
  for (const en of entries) if (en.isIntersecting) { const p = pageById(en.target.dataset.id); if (p) queueThumb(p); }
}, { root: $('#thumbs'), rootMargin: '400px 0px' });

function freePage(id) {
  const pe = pageEls.get(id); if (!pe) return;
  if (pe.task) { try { pe.task.cancel(); } catch (e) { /* ignore */ } pe.task = null; }
  pe.base.width = pe.base.height = 0; pe.ovl.width = pe.ovl.height = 0; pe.key = '';
}

/** Create/reorder/remove page DOM nodes so they match state.pages. */
function syncPages() {
  const host = $('#pages');
  const live = new Set();
  const z = state.zoom;
  state.pages.forEach((p, i) => {
    let pe = pageEls.get(p.id);
    if (!pe) {
      const el = document.createElement('div');
      el.className = 'page'; el.dataset.id = p.id;
      el.innerHTML = '<canvas class="base"></canvas><canvas class="ovl"></canvas><span class="pnum"></span>';
      pe = { el, base: $('.base', el), ovl: $('.ovl', el), key: '', task: null, pxPerPt: 1 };
      pageEls.set(p.id, pe); pageIO.observe(el);
    }
    live.add(p.id);
    const { w, h } = pview(p);
    pe.el.style.width = Math.round(w * z) + 'px';
    pe.el.style.height = Math.round(h * z) + 'px';
    $('.pnum', pe.el).textContent = i + 1;
    if (host.children[i] !== pe.el) host.insertBefore(pe.el, host.children[i] || null);
  });
  for (const [id, pe] of pageEls) if (!live.has(id)) { pageIO.unobserve(pe.el); freePage(id); pe.el.remove(); pageEls.delete(id); visible.delete(id); }
  updatePageClasses();
}

async function renderPage(p) {
  const pe = pageEls.get(p.id); if (!pe) return;
  const { R, w, h } = pview(p);
  let scale = state.zoom * DPR();

  if (w * h * scale * scale > maxPx) scale = Math.sqrt(maxPx / (w * h));
  const key = `${p.src}|${p.idx}|${R}|${scale.toFixed(3)}`;
  if (pe.key === key) { drawOverlay(p); return; }
  pe.key = key;
  if (pe.task) { try { pe.task.cancel(); } catch (e) { /* ignore */ } pe.task = null; }
  drawOverlay(p);
  try {
    const pg = await getPdfPage(p.src, p.idx);
    if (pe.key !== key) return;
    const vp = pg.getViewport({ scale, rotation: R });
    // Render off-screen, then swap: avoids a blank flash while zooming.
    const c = document.createElement('canvas');
    c.className = 'base'; c.width = Math.max(1, Math.round(vp.width)); c.height = Math.max(1, Math.round(vp.height));
    const task = pg.render({ canvasContext: c.getContext('2d'), viewport: vp });
    pe.task = task;
    await task.promise;
    pe.task = null;
    if (pe.key !== key) { c.width = c.height = 0; return; }
    const old = pe.base; pe.el.replaceChild(c, old); old.width = old.height = 0;
    pe.base = c; pe.pxPerPt = scale;
  } catch (e) {
    if (e && e.name === 'RenderingCancelledException') return;
    pe.key = '';

  }
}

function drawOverlay(p) {
  const pe = pageEls.get(p.id); if (!pe || !visible.has(p.id)) return;
  const { w, h } = pview(p);
  const s = state.zoom * DPR();
  const W = Math.max(1, Math.round(w * s)), H = Math.max(1, Math.round(h * s));
  if (pe.ovl.width !== W || pe.ovl.height !== H) { pe.ovl.width = W; pe.ovl.height = H; }
  const ctx = pe.ovl.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.setTransform(s, 0, 0, s, 0, 0);

}
function redrawOverlays() { for (const id of visible) { const p = pageById(id); if (p) drawOverlay(p); } }
const rerenderVisible = debounce(() => { for (const id of visible) { const p = pageById(id); if (p) renderPage(p); } }, 140);

/* ---- Thumbnails (rendered lazily, one at a time) ---- */
const THUMB_W = 132;

async function renderThumb(p) {

  if (te.key === key) return;
  const scale = THUMB_W / Math.max(w, h * 0.75);
  const c = te.canvas;
  c.width = Math.round(w * scale * Math.min(DPR(), 2)); c.height = Math.round(h * scale * Math.min(DPR(), 2));
  c.style.width = Math.round(w * scale) + 'px'; c.style.height = Math.round(h * scale) + 'px';
  try {
    const pg = await getPdfPage(p.src, p.idx);
    const k = c.width / w;
    await pg.render({ canvasContext: c.getContext('2d'), viewport: pg.getViewport({ scale: k, rotation: R }) }).promise;
    const ctx = c.getContext('2d'); ctx.setTransform(k, 0, 0, k, 0, 0);

function syncThumbs() {
  const host = $('#thumbs');
  const live = new Set();
  state.pages.forEach((p, i) => {
    let te = thumbEls.get(p.id);
    if (!te) {
      const el = document.createElement('div');
      el.className = 'thumb'; el.dataset.id = p.id;
      el.innerHTML = `<canvas class="tc"></canvas><div class="tn"></div><input type="checkbox" class="chk" aria-label="Select page"><div class="handle" title="Drag to reorder"><svg class="i"><use href="#i-grip"/></svg></div>`;
      te = { el, canvas: $('.tc', el), key: '' };
      thumbEls.set(p.id, te); thumbIO.observe(el);
    }
    live.add(p.id);
    $('.tn', te.el).textContent = i + 1;
    $('.chk', te.el).checked = state.checked.has(p.id);
    te.el.classList.toggle('checked', state.checked.has(p.id));
    te.el.classList.toggle('current', i === state.current);
    if (host.children[i] !== te.el) host.insertBefore(te.el, host.children[i] || null);
    // Size placeholder so lazy loading has something to observe
    if (!te.key) { const { w, h } = pview(p); const s = THUMB_W / Math.max(w, h * 0.75); te.canvas.style.width = Math.round(w * s) + 'px'; te.canvas.style.height = Math.round(h * s) + 'px'; }

}

/* ---- Zoom & navigation ---- */
function setZoom(z, fx, fy) {
  const v = $('#viewer');
  z = clamp(z, 0.1, 6);
  const old = state.zoom;
  if (Math.abs(z - old) < 1e-4) return;
  if (fx == null) { fx = v.clientWidth / 2; fy = v.clientHeight / 2; }
  const cx = v.scrollLeft + fx, cy = v.scrollTop + fy;
  state.zoom = z;
  syncPages();
  v.scrollLeft = cx * z / old - fx;
  v.scrollTop = cy * z / old - fy;
  $('#zoomLbl').textContent = Math.round(z * 100) + '%';
  redrawOverlays();
  rerenderVisible();
}
function fitWidth(silent) {
  if (!state.pages.length) return;
  const v = $('#viewer');
  const maxW = Math.max(...state.pages.slice(0, 50).map(p => pview(p).w));
  const pad = window.innerWidth <= 760 ? 18 : 40;
  const z = clamp((v.clientWidth - pad) / maxW, 0.1, 6);
  if (silent) { state.zoom = Math.min(z, 1.5); $('#zoomLbl').textContent = Math.round(state.zoom * 100) + '%'; syncPages(); rerenderVisible(); }
  else setZoom(z);
}
function goToPage(i) {
  i = clamp(i, 0, state.pages.length - 1);
  const pe = pageEls.get(state.pages[i] && state.pages[i].id); if (!pe) return;
  const v = $('#viewer');
  v.scrollTop = pe.el.offsetTop - 22;
  setCurrent(i);
}
function setCurrent(i) {
  if (state.current === i && $('#pageInput').value == i + 1) return;
  const prev = state.pages[state.current];
  state.current = i;
  $('#pageInput').value = state.pages.length ? i + 1 : 0;
  if (prev && thumbEls.get(prev.id)) thumbEls.get(prev.id).el.classList.remove('current');
  const cur = state.pages[i];
  const te = cur && thumbEls.get(cur.id);
  if (te) { te.el.classList.add('current'); if (!$('#sidebar').matches(':hover')) te.el.scrollIntoView({ block: 'nearest' }); }
}
function trackCurrent() {
  const v = $('#viewer'); const mid = v.getBoundingClientRect().top + v.clientHeight * 0.35;
  let best = state.current, bestD = Infinity;
  for (const id of visible) {
    const pe = pageEls.get(id); if (!pe) continue;
    const r = pe.el.getBoundingClientRect();
    const d = mid < r.top ? r.top - mid : mid > r.bottom ? mid - r.bottom : 0;
    if (d < bestD) { bestD = d; best = pageIndex(id); }
  }
  if (best >= 0) setCurrent(best);
}

/* ============================== Objects ============================== */
/*
 * Object types (all coordinates in points, displayed-page orientation):
 *  path  {pts,color,width,opacity,hl}         freehand pen / highlight
 *  line|arrow {pts:[[x1,y1],[x2,y2]],color,width,opacity}
 *  rect|ellipse {x,y,w,h,color,width,opacity,fill}
 *  whiteout {x,y,w,h,color}       cover {x,y,w,h,color,imageId?}
 *  image {x,y,w,h,rot,imageId,opacity}
 *  text  {x,y,w,h,rot,text,font,size,color,bold,italic,opacity}
 *  field {x,y,w,h,name,value}

 * becomes non-zero when a page with objects is rotated.
 */
const STD_FONTS = {
  Helvetica: { css: 'Helvetica, Arial, sans-serif', pdf: ['Helvetica', 'HelveticaBold', 'HelveticaOblique', 'HelveticaBoldOblique'] },
  Times: { css: '"Times New Roman", Times, serif', pdf: ['TimesRoman', 'TimesRomanBold', 'TimesRomanItalic', 'TimesRomanBoldItalic'] },
  Courier: { css: '"Courier New", Courier, monospace', pdf: ['Courier', 'CourierBold', 'CourierOblique', 'CourierBoldOblique'] },

function fontMeta(name) {

  const f = state.fonts.get(name);

function cssFont(o) {

/* ---- Image & font registries ---- */
async function registerImage(bytes, mime) {
  const id = 'i' + uid();
  const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
  const el = new Image(); el.src = url;
  await el.decode();
  state.images.set(id, { bytes, mime, el, w: el.naturalWidth, h: el.naturalHeight });
  return id;
}
/** Converts any browser-decodable image into PNG/JPEG bytes that pdf-lib can embed. */
async function imageFileToBytes(file) {
  let bytes = new Uint8Array(await file.arrayBuffer());
  const isPng = bytes[0] === 0x89 && bytes[1] === 0x50, isJpg = bytes[0] === 0xFF && bytes[1] === 0xD8;
  if (isPng) return { bytes, mime: 'image/png' };
  if (isJpg) return { bytes, mime: 'image/jpeg' };
  const bmp = await createImageBitmap(file);
  const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
  c.getContext('2d').drawImage(bmp, 0, 0);

}
async function registerFont(rec, persist) {
  const family = 'UF_' + rec.id;
  const face = new FontFace(family, rec.bytes);
  await face.load();
  document.fonts.add(face);
  state.fonts.set(rec.id, { ...rec, family });
  if (persist) { try { await idbFonts('put', { id: rec.id, name: rec.name, bytes: rec.bytes }); } catch (e) { toast('Font works for this session but could not be stored for next time.', 'warn'); } }
}
async function uploadFont(file) {
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const sig = String.fromCharCode(...bytes.subarray(0, 4));
    if (!['\x00\x01\x00\x00', 'OTTO', 'true'].includes(sig)) throw new Error('Not a TTF/OTF font file');
    // Validate with fontkit too, so export won't fail later.
    const fk = fontkit.create(bytes);
    const name = (fk.familyName || file.name.replace(/\.(ttf|otf)$/i, '')) + (fk.subfamilyName && fk.subfamilyName !== 'Regular' ? ' ' + fk.subfamilyName : '');
    const id = 'f' + uid();
    await registerFont({ id, name, bytes }, true);

    return id;
  } catch (e) { fail('Font upload failed', e); return null; }
}
function fontOptionsHTML(selectedName) {
  const opts = Object.keys(STD_FONTS).map(n => `<option value="${n}" ${n === selectedName ? 'selected' : ''}>${n}</option>`);
  for (const [id, f] of state.fonts) opts.push(`<option value="${id}" ${id === selectedName ? 'selected' : ''}>${esc(f.name)}</option>`);
  opts.push('<option value="__upload">Upload TTF/OTF font…</option>');

}
function pickFontFile() {
  return new Promise(res => {
    const inp = $('#fileFont'); inp.value = '';
    inp.onchange = async () => { const f = inp.files[0]; res(f ? await uploadFont(f) : null); };
    inp.oncancel = () => res(null);

    const parts = [];
    if (stats.matches) parts.push(`${stats.matches} text match${stats.matches > 1 ? 'es' : ''} (${stats.ops} operators)`);
    if (stats.tagged) parts.push(`${stats.tagged} tagged watermark block${stats.tagged > 1 ? 's' : ''}`);
    if (stats.annots) parts.push(`${stats.annots} annotation${stats.annots > 1 ? 's' : ''}`);
    toast(`Removed ${parts.join(', ') || 'watermark content'}. Use Undo if anything else disappeared.`, 'ok', 7000);
  } else if (!stats.textOps) {
    toast('No real text found on these pages — the watermark is probably part of an image or the page is scanned. Use Region mode (for image watermarks) or Cover mode.', 'warn', 9000);
  } else {
    toast(`"${state.wm.text}" was not found as text. It may be drawn as vector shapes or an image, or use a font without Unicode mapping. Try Region or Cover mode.`, 'warn', 9000);
  }
}
async function wmRegionRemove(p, r) {
  const targets = state.wm.regionAll ? state.pages.slice() : [p];
  const stats = await runWatermark(targets, 'Remove watermark (region)', { mode: 'region', viewRect: r });
  if (!stats) return;
  if (stats.applied) {
    const parts = [];
    const t = stats.ops - stats.images - stats.forms; // approximate count of text/path operators
    if (t > 0) parts.push(`${t} text/vector operator${t > 1 ? 's' : ''}`);
    if (stats.images) parts.push(`${stats.images} image${stats.images > 1 ? 's' : ''}`);
    if (stats.forms) parts.push(`${stats.forms} embedded graphic${stats.forms > 1 ? 's' : ''}`);
    if (stats.annots) parts.push(`${stats.annots} annotation${stats.annots > 1 ? 's' : ''}`);
    toast(`Removed ${parts.join(', ')} inside the rectangle${targets.length > 1 ? ` on ${targets.length} pages` : ''}. Undo is available.`, 'ok', 7000);
  } else toast('Nothing separable was found inside that rectangle (the watermark may be baked into a page image). Try Cover mode.', 'warn', 8000);
}
async function addCovers(p, r) {
  const targets = state.cover.all ? state.pages.slice() : [p];
  busy(true, 'Painting cover…');
  try {
    const add = [];
    for (let i = 0; i < targets.length; i++) {
      const t = targets[i];
      if (targets.length > 1) { busyText(`Cover ${i + 1}/${targets.length}…`); await yieldUI(); }
      const { w: PW, h: PH } = pview(t);
      const rr = { x: clamp(r.x, 0, PW), y: clamp(r.y, 0, PH) }; rr.w = clamp(r.w, 1, PW - rr.x); rr.h = clamp(r.h, 1, PH - rr.y);
      const color = state.cover.auto ? await sampleBorderColor(t, rr) : state.cover.color;
      const imageId = state.cover.blur ? await blurPatch(t, rr) : null;
      add.push([t.id, { id: newId(), type: 'cover', ...rr, color, imageId }]);
    }
    commit('Cover watermark', () => { for (const [pid, o] of add) { const pg = pageById(pid); pg.objects.push(o); touch(pg); } });
    toast('Cover applied. This only hides the area — the original content is still in the file underneath.', 'warn', 7000);
  } catch (e) { fail('Cover failed', e); }
  finally { busy(false); }
}

/* ============================== Page ops ============================== */
function targetPages() {
  const t = state.pages.filter(p => state.checked.has(p.id));
  return t.length ? t : [state.pages[state.current]].filter(Boolean);
}
function needDoc() { if (!state.pages.length) { toast('Open a PDF first.', 'warn'); return false; } return true; }
function clonePage(p) {
  const c = structuredClone(p); c.id = 'p' + uid(); c.v = ++REV;
  c.objects.forEach(o => { o.id = newId(); });
  return c;
}
function rotatePages(dir) {
  if (!needDoc()) return;
  const ts = targetPages();
  commit(`Rotate ${ts.length} page${ts.length > 1 ? 's' : ''}`, () => {
    for (const p of ts) {
      const { w, h } = pview(p);
      p.objects.forEach(o => rotateObj(o, dir, w, h));
      p.rot = (p.rot + (dir > 0 ? 90 : 270)) % 360; touch(p);
    }
  });
}
async function deletePages() {
  if (!needDoc()) return;
  const ts = targetPages();
  if (ts.length >= state.pages.length) { toast('A PDF needs at least one page — you cannot delete them all.', 'warn'); return; }
  if (ts.length > 1 && !await confirmBox('Delete pages', `Delete ${ts.length} pages? (Undo is available.)`, 'Delete', true)) return;
  const ids = new Set(ts.map(p => p.id));
  commit(`Delete ${ts.length} page${ts.length > 1 ? 's' : ''}`, () => { state.pages = state.pages.filter(p => !ids.has(p.id)); });
  state.checked.clear(); onDocChanged();
}
function duplicatePages() {
  if (!needDoc()) return;
  const ids = new Set(targetPages().map(p => p.id));
  commit('Duplicate pages', () => {
    const out = [];
    for (const p of state.pages) { out.push(p); if (ids.has(p.id)) out.push(clonePage(p)); }
    state.pages = out;
  });
}
async function insertBlank() {
  if (!needDoc()) return;
  try {
    const cur = state.pages[state.current];
    const { w, h } = pview(cur);
    const doc = await PDFDocument.create(); doc.addPage([w, h]);
    const src = await addSource(await doc.save(), 'Blank page', { info: [{ w, h, rot: 0 }] });
    const at = state.current + 1;
    commit('Insert blank page', () => { state.pages.splice(at, 0, ...pageModelsFor(src, [0])); });
    setTimeout(() => goToPage(at), 60);
  } catch (e) { fail('Insert blank page', e); }
}
function movePages(ids, toIndex) {
  const moving = state.pages.filter(p => ids.has(p.id));
  if (!moving.length) return;
  commit('Reorder pages', () => {
    const before = state.pages.slice(0, toIndex).filter(p => !ids.has(p.id)).length;
    const rest = state.pages.filter(p => !ids.has(p.id));
    rest.splice(before, 0, ...moving);
    state.pages = rest;
  });
}
function mergePdf(position) {
  if (!needDoc()) return;
  const inp = $('#fileMerge'); inp.value = '';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const src = await loadPdfFile(f, { forMerge: true });
    if (!src) return;
    const at = clamp(position == null ? state.pages.length : position, 0, state.pages.length);
    commit(`Merge ${f.name}`, () => { state.pages.splice(at, 0, ...pageModelsFor(src, src.info.map((_, i) => i))); });
    toast(`Inserted ${src.info.length} page${src.info.length > 1 ? 's' : ''} from ${f.name} after page ${at}.`, 'ok');
    setTimeout(() => goToPage(at), 80);
  };
  inp.click();
}

/* =============================== Export =============================== */
async function buildPdf(pms) {
  if (!pms.length) throw new Error('No pages to export');
  let doc, libPages;
  const first = state.sources.get(pms[0].src);
  const identity = pms.length === first.info.length && pms.every((p, i) => p.src === first.id && p.idx === i);
  if (identity) {
    // Same pages in the same order: rewrite the original file (keeps forms, bookmarks, metadata).
    doc = await PDFDocument.load(first.bytes, { updateMetadata: false });
    libPages = doc.getPages();
  } else {
    doc = await PDFDocument.create();
    libPages = [];
    for (let i = 0; i < pms.length;) {
      let j = i; while (j < pms.length && pms[j].src === pms[i].src) j++;
      busyText(`Assembling pages ${i + 1}–${j}…`); await yieldUI();
      const sdoc = await getLibDoc(state.sources.get(pms[i].src));
      const copied = await doc.copyPages(sdoc, pms.slice(i, j).map(p => p.idx));
      for (const c of copied) { doc.addPage(c); libPages.push(c); }
      i = j;
    }
    doc.setTitle(baseName());
  }
  doc.registerFontkit(fontkit);
  const cache = { fonts: new Map(), images: new Map(), warnings: [] };
  for (let k = 0; k < pms.length; k++) {
    const pm = pms[k], pg = libPages[k], { R } = pview(pm);
    pg.setRotation(degrees(R));
    if (pm.objects.length) {
      if (k % 20 === 0) { busyText(`Writing annotations… page ${k + 1}/${pms.length}`); await yieldUI(); }
      await drawPdfObjects(doc, pg, pm, R, cache, k + 1);
    }
  }
  doc.setProducer('PDF Desk (pdf-lib, in-browser)');
  doc.setModificationDate(new Date());
  busyText('Saving PDF…'); await yieldUI();
  return { bytes: await doc.save(), warnings: cache.warnings };
}

async function embedFontFor(doc, o, cache) {
  const meta = fontMeta(o.font);
  if (meta.std) {
    const fam = STD_FONTS[o.font] || STD_FONTS.Helvetica;
    const name = fam.pdf[(o.bold ? 1 : 0) + (o.italic ? 2 : 0)];
    if (!cache.fonts.has(name)) cache.fonts.set(name, await doc.embedFont(StandardFonts[name]));
    return cache.fonts.get(name);
  }
  if (!cache.fonts.has(o.font)) {
    // Subset embedding is required for complex scripts: pdf-lib's full embedding only writes
    // widths for glyphs reachable from the cmap, so Devanagari half-forms/conjuncts get wrong spacing.
    cache.fonts.set(o.font, await doc.embedFont(state.fonts.get(o.font).bytes, { subset: true }));
  }
  return cache.fonts.get(o.font);
}
async function embedImageFor(doc, id, cache) {
  if (!cache.images.has(id)) {
    const im = state.images.get(id);
    if (!im) throw new Error('image data missing');
    cache.images.set(id, im.mime === 'image/png' ? await doc.embedPng(im.bytes) : await doc.embedJpg(im.bytes));
  }
  return cache.images.get(id);
}
const svgPathOf = (pts) => {
  const f = (n) => (Math.round(n * 100) / 100).toString();
  const d = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${f(x)} ${f(-y)}`);
  if (pts.length === 1) d.push(`L${f(pts[0][0] + 0.01)} ${f(-pts[0][1])}`);
  return d.join(' ');
};
async function drawPdfObjects(doc, pg, pm, R, cache, pageNo) {
  const box = pg.getCropBox();
  const P = (x, y) => viewToPdf(x, y, R, box);
  const rectPdf = (o) => { const a = P(o.x, o.y), b = P(o.x + o.w, o.y + o.h); return { x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), width: Math.abs(a[0] - b[0]), height: Math.abs(a[1] - b[1]) }; };
  const stroke = (o) => ({ borderColor: pdfColor(o.color), borderWidth: o.width, borderOpacity: o.opacity ?? 1 });
  const drawImageObj = async (o) => {
    const emb = await embedImageFor(doc, o.imageId, cache);
    const [lw, lh] = localDims(o);
    const [vx, vy] = localToView(o, 0, lh);
    const [x, y] = P(vx, vy);
    pg.drawImage(emb, { x, y, width: lw, height: lh, rotate: degrees(R - (o.rot || 0)), opacity: o.opacity ?? 1 });
  };
  for (const o of pm.objects) {
    try {
      switch (o.type) {
        case 'whiteout': pg.drawRectangle({ ...rectPdf(o), color: pdfColor(o.color || '#ffffff'), borderWidth: 0 }); break;
        case 'cover':
          if (o.imageId) await drawImageObj({ ...o, rot: 0, opacity: 1 });
          else pg.drawRectangle({ ...rectPdf(o), color: pdfColor(o.color || '#ffffff'), borderWidth: 0 });
          break;
        case 'rect':
          pg.drawRectangle({ ...rectPdf(o), ...stroke(o), color: o.fill ? pdfColor(o.color) : undefined, opacity: o.fill ? (o.opacity ?? 1) : undefined });
          break;
        case 'ellipse': {
          const [cx, cy] = P(o.x + o.w / 2, o.y + o.h / 2);
          const [rx, ry] = R % 180 ? [o.h / 2, o.w / 2] : [o.w / 2, o.h / 2];
          pg.drawEllipse({ x: cx, y: cy, xScale: Math.max(0.5, rx), yScale: Math.max(0.5, ry), ...stroke(o), color: o.fill ? pdfColor(o.color) : undefined, opacity: o.fill ? (o.opacity ?? 1) : undefined });
          break;
        }
        case 'path': case 'line': case 'arrow': {
          const pts = o.type === 'arrow' ? [o.pts[0], arrowGeom(o).end] : o.pts;
          pg.pushOperators(PDFLib.pushGraphicsState(), PDFLib.setLineJoin(PDFLib.LineJoinStyle.Round));
          pg.drawSvgPath(svgPathOf(pts.map(q => P(q[0], q[1]))), { x: 0, y: 0, ...stroke(o), borderLineCap: LineCapStyle.Round, blendMode: o.hl ? BlendMode.Multiply : undefined });
          if (o.type === 'arrow') pg.drawSvgPath(svgPathOf(arrowGeom(o).tri.map(q => P(q[0], q[1]))) + ' Z', { x: 0, y: 0, color: pdfColor(o.color), opacity: o.opacity ?? 1 });
          pg.pushOperators(PDFLib.popGraphicsState());
          break;
        }
        case 'text': {
          const font = await embedFontFor(doc, o, cache);
          String(o.text).split('\n').forEach((line, i) => {
            if (!line) return;
            const [vx, vy] = localToView(o, 0, i * o.size * 1.2 + o.size * 0.9);
            const [x, y] = P(vx, vy);
            pg.drawText(line, { x, y, size: o.size, font, color: pdfColor(o.color), opacity: o.opacity ?? 1, rotate: degrees(R - (o.rot || 0)) });
          });
          break;
        }
        case 'image': await drawImageObj(o); break;
        case 'field': {
          const form = doc.getForm();
          let name = o.name || 'Field', n = 1;
          while (form.getFieldMaybe(name)) name = `${o.name || 'Field'}_${++n}`;
          const tf = form.createTextField(name);
          if (o.value) tf.setText(o.value);
          tf.addToPage(pg, { ...rectPdf(o), borderWidth: 0.75, borderColor: rgb(0.36, 0.55, 1), backgroundColor: rgb(1, 1, 1) });
          break;
        }
      }
    } catch (e) {
      cache.warnings.push(`Page ${pageNo}: a ${o.type} object was skipped (${e.message})`);
    }
  }
}

async function downloadPdf() {
  if (!needDoc()) return;
  if (state.readOnly) { toast('This document is view-only (encrypted/damaged). Reopen it and choose "Convert to image copy" to save edits.', 'warn', 8000); return; }
  busy(true, 'Building PDF…');
  try {
    const { bytes, warnings } = await buildPdf(state.pages);
    downloadBlob(bytes, `${baseName()}_edited.pdf`);
    if (warnings.length) toast(warnings.slice(0, 3).join(' · ') + (warnings.length > 3 ? ` (+${warnings.length - 3} more)` : ''), 'warn', 10000);
    else toast(`Saved ${baseName()}_edited.pdf (${fmtBytes(bytes.length)})`, 'ok');
  } catch (e) { fail('Download failed', e); }
  finally { busy(false); }
}
async function extractRange(text) {
  if (!needDoc()) return;
  let idx;
  try { idx = parseRanges(text, state.pages.length).flat(); } catch (e) { toast(e.message, 'error'); return; }
  busy(true, 'Extracting…');
  try {
    const { bytes } = await buildPdf(idx.map(i => state.pages[i]));
    downloadBlob(bytes, `${baseName()}_pages_${text.replace(/[^0-9,-]+/g, '').replace(/,/g, '_')}.pdf`);
    toast(`Extracted ${idx.length} page${idx.length > 1 ? 's' : ''}.`, 'ok');
  } catch (e) { fail('Extract failed', e); } finally { busy(false); }
}
async function splitPdf(mode, text) {
  if (!needDoc()) return;
  let groups;
  try {
    const n = state.pages.length;
    if (mode === 'each') groups = state.pages.map((_, i) => [i]);
    else if (mode === 'every') {
      const k = parseInt(text, 10); if (!(k >= 1)) throw new Error('Enter how many pages per file');
      groups = []; for (let i = 0; i < n; i += k) groups.push(Array.from({ length: Math.min(k, n - i) }, (_, j) => i + j));
    } else groups = parseRanges(text, n);
  } catch (e) { toast(e.message, 'error'); return; }
  busy(true, 'Splitting…');
  try {
    const zip = new JSZip();
    for (let g = 0; g < groups.length; g++) {
      busyText(`Building file ${g + 1}/${groups.length}…`); await yieldUI();
      const { bytes } = await buildPdf(groups[g].map(i => state.pages[i]));
      const a = groups[g][0] + 1, b = groups[g][groups[g].length - 1] + 1;
      zip.file(`${baseName()}_${String(g + 1).padStart(3, '0')}_p${a}${b !== a ? '-' + b : ''}.pdf`, bytes);
    }
    busyText('Zipping…');
    downloadBlob(await zip.generateAsync({ type: 'blob' }), `${baseName()}_split.zip`, 'application/zip');
    toast(`Split into ${groups.length} PDF file${groups.length > 1 ? 's' : ''} (ZIP).`, 'ok');
  } catch (e) { fail('Split failed', e); } finally { busy(false); }
}
async function exportImages(fmt, scale, rangeText) {
  if (!needDoc()) return;
  let idx;
  try { idx = rangeText.trim() ? parseRanges(rangeText, state.pages.length).flat() : state.pages.map((_, i) => i); } catch (e) { toast(e.message, 'error'); return; }
  const mime = fmt === 'jpg' ? 'image/jpeg' : 'image/png';
  busy(true, 'Rendering pages…');
  try {
    const zip = new JSZip(); let single = null;
    for (let n = 0; n < idx.length; n++) {
      const p = state.pages[idx[n]];
      busyText(`Rendering page ${n + 1}/${idx.length}…`); await yieldUI();
      const pg = await getPdfPage(p.src, p.idx);
      const { R, w, h } = pview(p);
      const k = Math.min(scale, Math.sqrt(30e6 / (w * h)));
      const vp = pg.getViewport({ scale: k, rotation: R });
      const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      await pg.render({ canvasContext: ctx, viewport: vp }).promise;
      ctx.setTransform(k, 0, 0, k, 0, 0);
      drawObjects(ctx, p, { composite: true });
      const blob = await new Promise(r => c.toBlob(r, mime, 0.92));
      c.width = c.height = 0;
      const name = `${baseName()}_page_${String(idx[n] + 1).padStart(3, '0')}.${fmt}`;
      if (idx.length === 1) single = [blob, name]; else zip.file(name, blob);
    }
    if (single) downloadBlob(single[0], single[1], mime);
    else { busyText('Zipping…'); downloadBlob(await zip.generateAsync({ type: 'blob' }), `${baseName()}_${fmt}.zip`, 'application/zip'); }
    toast(`Exported ${idx.length} image${idx.length > 1 ? 's' : ''}.`, 'ok');
  } catch (e) { fail('Image export failed', e); } finally { busy(false); }
}

/* ================================ Forms ================================ */
async function scanForms() {
  const out = [];
  for (const id of [...new Set(state.pages.map(p => p.src))]) {
    const src = state.sources.get(id);
    try {
      const fields = (await getLibDoc(src)).getForm().getFields();
      if (fields.length) out.push({ src, fields });
    } catch (e) { console.warn('forms', e); }
  }
  return out;
}
function fieldKind(f) {
  if (f instanceof PDFLib.PDFTextField) return 'text';
  if (f instanceof PDFLib.PDFCheckBox) return 'check';
  if (f instanceof PDFLib.PDFDropdown || f instanceof PDFLib.PDFOptionList) return 'choice';
  if (f instanceof PDFLib.PDFRadioGroup) return 'radio';
  return null;
}
function fieldValue(f, kind) {
  try {
    if (kind === 'text') return f.getText() || '';
    if (kind === 'check') return f.isChecked();
    if (kind === 'choice') return (f.getSelected() || [])[0] || '';
    if (kind === 'radio') return f.getSelected() || '';
  } catch (e) { return ''; }
  return '';
}
async function applyForms(changes, fontId) {
  // changes: Map(srcId -> [{name, kind, value}])
  busy(true, 'Filling form…');
  try {
    const remap = new Map();
    for (const [srcId, list] of changes) {
      const src = state.sources.get(srcId);
      const doc = await PDFDocument.load(src.bytes, { updateMetadata: false });
      doc.registerFontkit(fontkit);
      const form = doc.getForm();
      const needsUnicode = list.some(c => typeof c.value === 'string' && !winAnsiOk(c.value));
      if (needsUnicode && !fontId) throw new Error('Some values contain characters (e.g. Hindi) that need a custom font — choose one under "Font for filled values"');
      for (const c of list) {
        const f = form.getField(c.name);
        if (c.kind === 'text') f.setText(c.value || undefined);
        else if (c.kind === 'check') c.value ? f.check() : f.uncheck();
        else if (c.kind === 'choice' || c.kind === 'radio') { if (c.value) f.select(c.value); else if (f.clear) f.clear(); }
      }
      if (fontId) form.updateFieldAppearances(await doc.embedFont(state.fonts.get(fontId).bytes, { subset: true }));
      const ns = await addSource(await doc.save({ updateFieldAppearances: !fontId }), src.name, { info: src.info });
      remap.set(srcId, ns.id);
    }
    commit('Fill form fields', () => { for (const p of state.pages) if (remap.has(p.src)) { p.src = remap.get(p.src); touch(p); } });
    toast('Form updated.', 'ok');
  } catch (e) { fail('Form fill failed', e); }
  finally { busy(false); }
}

/* ================================= UI ================================= */
function onDocChanged() {
  if (state.sel && !findObj(state.sel.pageId, state.sel.objId)) state.sel = null;
  for (const id of [...state.checked]) if (!pageById(id)) state.checked.delete(id);
  if (state.current >= state.pages.length) state.current = Math.max(0, state.pages.length - 1);
  syncPages(); syncThumbs();
  for (const id of visible) { const p = pageById(id); if (p) renderPage(p); }
  updateChrome(); renderOptbar(); autosave();
  if (state.panel === 'pages' || state.panel === 'forms') renderPanel();
}
function updateChrome() {
  const has = state.pages.length > 0;
  $('#empty').classList.toggle('hidden', has);
  $('#btnSave').disabled = !has;
  $('#btnUndo').disabled = !history.undo.length;
  $('#btnRedo').disabled = !history.redo.length;
  $('#btnUndo').title = history.undo.length ? `Undo: ${history.undo[history.undo.length - 1].label} (Ctrl+Z)` : 'Undo';
  $('#btnRedo').title = history.redo.length ? `Redo: ${history.redo[history.redo.length - 1].label} (Ctrl+Y)` : 'Redo';
  $('#fname').textContent = has ? state.fileName + (state.readOnly ? ' (view only)' : '') : '';
  $('#pageCount').textContent = state.pages.length;
  $('#pageInput').value = has ? state.current + 1 : 0;
  const n = state.checked.size;
  $('#sbInfo').textContent = has ? (n ? `${n} selected — actions apply to them` : `${state.pages.length} pages · actions apply to current`) : 'No document';
  document.title = has ? `${state.fileName} — PDF Desk` : 'PDF Desk';
}

/* ---- Option bar (tool settings / selected object actions) ---- */
let styleBefore = null;
function renderOptbar() {
  const ob = $('#optbar');
  const s = selected();
  const parts = [];
  const colorIn = (v) => `<label>Color <input type="color" data-k="color" value="${v}"></label>`;
  const widthIn = (v, max = 30) => `<label>Width <input type="range" data-k="width" min="0.5" max="${max}" step="0.5" value="${v}"></label>`;
  const opIn = (v) => `<label>Opacity <input type="range" data-k="opacity" min="0.1" max="1" step="0.05" value="${v ?? 1}"></label>`;
  const fillIn = (v) => `<label><input type="checkbox" data-k="fill" ${v ? 'checked' : ''}> Fill</label>`;
  const act = (a, icon, label, cls = '') => `<button class="btn sm ${cls}" data-act="${a}" title="${label}"><svg class="i"><use href="#i-${icon}"/></svg><span class="hide-sm">${label}</span></button>`;
  if (s) {
    const o = s.obj;
    if (['path', 'line', 'arrow', 'rect', 'ellipse', 'text', 'whiteout'].includes(o.type) || (o.type === 'cover' && !o.imageId)) parts.push(colorIn(o.color));
    if (['path', 'line', 'arrow', 'rect', 'ellipse'].includes(o.type)) parts.push(widthIn(o.width, o.hl ? 60 : 30));
    if (['path', 'line', 'arrow', 'rect', 'ellipse', 'text', 'image'].includes(o.type)) parts.push(opIn(o.opacity));
    if (o.type === 'rect' || o.type === 'ellipse') parts.push(fillIn(o.fill));
    if (o.type === 'text') parts.push(act('edit', 'edit', 'Edit text'));
    if (o.type === 'field') parts.push(act('field', 'edit', 'Name/value'));
    if (o.type === 'cover') parts.push('<span class="hint">Cover (hides, does not remove)</span>');
    parts.push(act('dup', 'dup', 'Duplicate'), act('front', 'front', 'Front'), act('back', 'back', 'Back'), act('del', 'trash', 'Delete', 'danger'));
  } else {
    const t = state.tool, o = state.opts[t];
    if (['pen', 'line', 'arrow', 'rect', 'ellipse', 'highlight'].includes(t)) {
      parts.push(colorIn(o.color), widthIn(o.width, t === 'highlight' ? 60 : 30), opIn(o.opacity));
      if (t === 'rect' || t === 'ellipse') parts.push(fillIn(o.fill));
    } else if (t === 'text') {
      parts.push(`<label>Font <select data-k="font">${fontOptionsHTML(o.font)}</select></label>`,
        `<label>Size <input type="number" data-k="size" min="3" max="500" value="${o.size}" style="width:64px"></label>`, colorIn(o.color));
    } else if (t === 'whiteout') parts.push(colorIn(o.color), '<span class="hint">Drag to cover content with a solid box.</span>');
    if (TOOL_HINTS[t]) parts.push(`<span class="hint">${TOOL_HINTS[t]}</span>`);
  }

}
function onOptInput(e) {
  const k = e.target.dataset.k; if (!k) return;
  const val = e.target.type === 'checkbox' ? e.target.checked : e.target.type === 'range' || e.target.type === 'number' ? +e.target.value : e.target.value;
  const s = selected();
  if (s) {
    if (!styleBefore) styleBefore = snap();
    const live = selected(); live.obj[k] = val;
    drawOverlay(live.page);
    if (e.type === 'change') { touch(live.page); pushCommand('Change style', styleBefore); styleBefore = null; }
  } else if (state.opts[state.tool]) {
    if (k === 'font' && val === '__upload') { pickFontFile().then(id => { if (id) state.opts.text.font = id; renderOptbar(); }); return; }
    state.opts[state.tool][k] = val;
  }
}
async function onOptAction(a) {
  const s = selected(); if (!s) return;
  const { page: p, obj: o } = s;
  const i = p.objects.indexOf(o);
  if (a === 'del') { commit('Delete object', () => { p.objects.splice(i, 1); touch(p); }); state.sel = null; onDocChanged(); }
  else if (a === 'dup') { const c = structuredClone(o); c.id = newId(); moveObj(c, 12, 12); commit('Duplicate object', () => { p.objects.push(c); touch(p); }); select(p.id, c.id); }
  else if (a === 'front') commit('Bring to front', () => { p.objects.splice(i, 1); p.objects.push(o); touch(p); });
  else if (a === 'back') commit('Send to back', () => { p.objects.splice(i, 1); p.objects.unshift(o); touch(p); });
  else if (a === 'edit') await editText(p, o);
  else if (a === 'field') {
    const res = await modal({
      title: 'Form field', body: `<div class="col"><label>Name</label><input id="ffN" value="${esc(o.name)}"></div><div class="col"><label>Default value (optional)</label><input id="ffV" value="${esc(o.value || '')}"></div>`,
      buttons: [{ label: 'Cancel', value: null }, { label: 'Save', primary: true, collect: true }],
      collect: r => ({ name: $('#ffN', r).value.trim().replace(/[.\s]+/g, '_') || 'Field', value: $('#ffV', r).value })
    });
    if (res) commit('Edit field', () => { Object.assign(o, res); touch(p); });
  }
}
