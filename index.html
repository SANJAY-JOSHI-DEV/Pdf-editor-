/* ---- Thumbnail interactions: tap = go to page, checkbox = select, grip = drag reorder ---- */
let thumbDrag = null;
function wireThumbs() {
  const host = $('#thumbs');
  host.addEventListener('click', (e) => {
    const t = e.target.closest('.thumb'); if (!t || e.target.closest('.handle')) return;
    const id = t.dataset.id;
    if (e.target.classList.contains('chk')) {
      e.target.checked ? state.checked.add(id) : state.checked.delete(id);
      t.classList.toggle('checked', e.target.checked); updateChrome(); if (state.panel === 'pages') renderPanel(); return;
    }
    goToPage(pageIndex(id));
    if (window.innerWidth <= 760) $('#sidebar').classList.remove('open');
  });
  host.addEventListener('pointerdown', (e) => {
    const h = e.target.closest('.handle'); if (!h) return;
    const t = h.closest('.thumb');
    e.preventDefault(); h.setPointerCapture(e.pointerId);
    const ids = state.checked.has(t.dataset.id) ? new Set(state.checked) : new Set([t.dataset.id]);
    thumbDrag = { ids, pointerId: e.pointerId, target: null, after: false };
    for (const id of ids) thumbEls.get(id) && thumbEls.get(id).el.classList.add('dragging');
  });
  host.addEventListener('pointermove', (e) => {
    if (!thumbDrag || e.pointerId !== thumbDrag.pointerId) return;
    const r = host.getBoundingClientRect();
    if (e.clientY < r.top + 40) host.scrollTop -= 12; else if (e.clientY > r.bottom - 40) host.scrollTop += 12;
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const t = under && under.closest('.thumb');
    $$('.thumb.drop-before,.thumb.drop-after', host).forEach(x => x.classList.remove('drop-before', 'drop-after'));
    if (!t) { thumbDrag.target = null; return; }
    const tr = t.getBoundingClientRect(); const after = e.clientY > tr.top + tr.height / 2;
    t.classList.add(after ? 'drop-after' : 'drop-before');
    thumbDrag.target = t.dataset.id; thumbDrag.after = after;
  });
  const end = (e) => {
    if (!thumbDrag || e.pointerId !== thumbDrag.pointerId) return;
    const d = thumbDrag; thumbDrag = null;
    $$('.thumb', host).forEach(x => x.classList.remove('dragging', 'drop-before', 'drop-after'));
    if (!d.target || d.ids.has(d.target) || e.type === 'pointercancel') return;
    movePages(d.ids, pageIndex(d.target) + (d.after ? 1 : 0));
  };
  host.addEventListener('pointerup', end);
  host.addEventListener('pointercancel', end);
}

/* ---- Pinch zoom (touch) and Ctrl+wheel zoom ---- */
const pinch = { active: false };
function wireZoomGestures() {
  const v = $('#viewer'), pages = $('#pages');
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  v.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 2 || !state.pages.length) return;
    cancelDrag();
    const r = v.getBoundingClientRect();
    Object.assign(pinch, {
      active: true, d0: dist(e.touches), z0: state.zoom, s: 1,
      fx: (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, fy: (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top
    });
    pages.style.transformOrigin = `${v.scrollLeft + pinch.fx}px ${v.scrollTop + pinch.fy}px`;
    e.preventDefault();
  }, { passive: false });
  v.addEventListener('touchmove', (e) => {
    if (!pinch.active || e.touches.length !== 2) return;
    pinch.s = clamp(dist(e.touches) / pinch.d0, 0.1 / pinch.z0, 6 / pinch.z0);
    pages.style.transform = `scale(${pinch.s})`;
    e.preventDefault();
  }, { passive: false });
  const endPinch = (e) => {
    if (!pinch.active || e.touches.length >= 2) return;
    pinch.active = false;
    pages.style.transform = '';
    setZoom(pinch.z0 * pinch.s, pinch.fx, pinch.fy);
  };
  v.addEventListener('touchend', endPinch);
  v.addEventListener('touchcancel', endPinch);
  v.addEventListener('wheel', (e) => {
    if (!e.ctrlKey || !state.pages.length) return;
    e.preventDefault();
    const r = v.getBoundingClientRect();
    setZoom(state.zoom * Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0025)), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  v.addEventListener('scroll', () => { if (!pinch.active) trackCurrent(); }, { passive: true });
}

/* ---- Wiring ---- */
function pageOp(op) {
  if (state.readOnly && op !== 'none') { toast('This document is view-only.', 'warn'); return; }
  ({ rotl: () => rotatePages(-1), rotr: () => rotatePages(1), del: deletePages, dup: duplicatePages, blank: insertBlank })[op]();
}
function wireUI() {
  const pick = () => { const i = $('#filePdf'); i.value = ''; i.click(); };
  $('#btnOpen').onclick = pick; $('#btnOpen2').onclick = pick;
  $('#filePdf').onchange = (e) => { const f = e.target.files[0]; if (f) openMainFile(f); };
  $('#btnSave').onclick = downloadPdf;
  $('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo;
  $('#btnZoomIn').onclick = () => setZoom(state.zoom * 1.2);
  $('#btnZoomOut').onclick = () => setZoom(state.zoom / 1.2);
  $('#btnFit').onclick = () => fitWidth();
  $('#btnMenu').onclick = () => openPanel(state.panel && state.panel !== 'export' ? state.panel : 'export');
  $('#sbToggle').onclick = () => $('#sidebar').classList.toggle('open');
  $('#pageInput').onchange = (e) => { const n = parseInt(e.target.value, 10); if (n >= 1) goToPage(n - 1); else e.target.value = state.current + 1; };
  $('#pageInput').onfocus = (e) => e.target.select();
  $('#panelClose').onclick = () => openPanel(state.panel);
  $('#sbAll').onclick = () => {
    if (state.checked.size === state.pages.length) state.checked.clear(); else state.pages.forEach(p => state.checked.add(p.id));
    syncThumbs(); updateChrome(); if (state.panel === 'pages') renderPanel();
  };
  document.addEventListener('click', (e) => {
    const op = e.target.closest('[data-pageop]'); if (op) { if (needDoc()) pageOp(op.dataset.pageop); return; }
    const t = e.target.closest('#toolbar [data-tool]'); if (t) { setTool(t.dataset.tool); return; }
    const pn = e.target.closest('#toolbar [data-panel]'); if (pn) { openPanel(pn.dataset.panel); return; }
    const act = e.target.closest('#optbar [data-act]'); if (act) onOptAction(act.dataset.act);
  });
  $('#optbar').addEventListener('input', onOptInput);
  $('#optbar').addEventListener('change', onOptInput);
  const pages = $('#pages');
  pages.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', (e) => { if (drag && e.pointerId === drag.pointerId) cancelDrag(); });
  pages.addEventListener('dblclick', (e) => {
    const el = e.target.closest('.page'); if (!el || state.tool !== 'select') return;
    const p = pageById(el.dataset.id), [x, y] = evtPoint(e, pageEls.get(p.id));
    const o = hitObj(p, x, y);
    if (o && o.type === 'text') editText(p, o);
  });
  $('#viewer').addEventListener('pointerdown', (e) => { if (!e.target.closest('.page') && state.sel) select(null); });
  wireThumbs(); wireZoomGestures();

  // Drag & drop a PDF anywhere
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; document.body.classList.add('dragover'); } });
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragover'); } });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragover');
    const f = e.dataTransfer && e.dataTransfer.files[0]; if (!f) return;
    if (/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)) openMainFile(f); else toast('Drop a PDF file.', 'warn');
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName) || document.querySelector('.modal-back');
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); downloadPdf(); return; }
    if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); pick(); return; }
    if (typing) return;
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); setZoom(state.zoom * 1.2); return; }
    if (mod && e.key === '-') { e.preventDefault(); setZoom(state.zoom / 1.2); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && state.sel) { e.preventDefault(); onOptAction('del'); return; }
    if (e.key === 'Escape') { if (state.sel) select(null); else setTool('select'); return; }
    if (e.key === 'PageDown') { goToPage(state.current + 1); e.preventDefault(); }
    if (e.key === 'PageUp') { goToPage(state.current - 1); e.preventDefault(); }
  });
  window.addEventListener('resize', debounce(() => { redrawOverlays(); }, 200));
  window.addEventListener('beforeunload', (e) => { if (history.undo.length) { e.preventDefault(); e.returnValue = ''; } });
}

/* ---- Boot ---- */
async function boot() {
  loadSettings();
  wireUI();
  renderOptbar(); updateChrome();
  if (!LIBS_OK) {
    $('#empty .card').innerHTML = '<h1>Libraries could not load</h1><p>PDF Desk needs to download its PDF engines once (from cdn.jsdelivr.net). Check your internet connection and reload. After the first successful load they are cached for offline use.</p><button class="btn primary" onclick="location.reload()">Reload</button>';
    return;
  }
  try { for (const f of await idbFonts('all')) await registerFont(f, false); } catch (e) { console.warn('fonts', e); }
  renderOptbar();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
  }
  showNotice(false);
}
window.addEventListener('error', (e) => { if (e.message && !/ResizeObserver/.test(e.message)) toast('Unexpected error: ' + e.message, 'error'); });
window.addEventListener('unhandledrejection', (e) => { const m = e.reason && (e.reason.message || e.reason); if (m && !/cancel/i.test(m)) toast('Unexpected error: ' + m, 'error'); });
boot();
</script>
